[package]
name = "gowired-avr"
description = "ATmega328P/328PB register layer for the GoWired module."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gowired-core = { path = "../gowired-core" }

[features]
default = []
# External temperature/humidity probe. At most one.
probe-sht30 = []
probe-dht22 = []

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
# See gowired-core's Cargo.toml: fixed-point firmware is width conversions.
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# `for i in 0..raw.len()` where the body also needs `i` for the ack decision.
needless_range_loop = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
